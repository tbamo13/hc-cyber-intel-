<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#060A12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CyberIntel" />
  <meta name="description" content="Healthcare Cybersecurity Intelligence Dashboard" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>HC Cyber Intel</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700;800&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { min-height: 100vh; min-height: 100dvh; }
    body { background: #060A12; color: #fff; font-family: 'IBM Plex Sans', sans-serif; -webkit-font-smoothing: antialiased; overscroll-behavior-y: contain; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes scanLine { 0% { transform: translateX(-100%); } 100% { transform: translateX(200%); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    @keyframes gridMove { 0% { background-position: 0 0; } 100% { background-position: 40px 40px; } }
    .pulse-ring { animation: pulse 1.5s ease-in-out infinite; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.5/babel.min.js"></script>

  <script type="text/babel" data-type="module">
    const { useState, useCallback } = React;
    const API_KEY_STORAGE = 'hc_cyber_intel_api_key';

    const CATEGORIES = [
      { id: "breaches", label: "Healthcare Breaches", icon: "\u{1F3E5}", query: "healthcare data breach 2026 hospital cyberattack", color: "#FF3B5C" },
      { id: "cves", label: "Critical CVEs", icon: "\u{1F6E1}\uFE0F", query: "critical CVE healthcare medical device 2026", color: "#00E5FF" },
      { id: "hipaa", label: "HIPAA & Regulations", icon: "\u2696\uFE0F", query: "HIPAA regulation update 2026 HHS OCR cybersecurity", color: "#FFAB40" },
      { id: "threats", label: "Threat Intelligence", icon: "\u{1F50D}", query: "ransomware healthcare hospital 2026 threat actor", color: "#B388FF" },
      { id: "zscaler", label: "Zscaler & Zero Trust", icon: "\u26A1", query: "Zscaler zero trust healthcare ZTNA SSE 2026", color: "#00E676" },
    ];

    const SYS = `Healthcare cybersecurity analyst for Zscaler sales. Return ONLY a JSON array of EXACTLY 3 objects with: "title" (max 10 words), "summary" (2 sentences), "severity" ("CRITICAL"/"HIGH"/"MEDIUM"/"LOW"), "date", "source", "url" (real source URL from search), "zscaler_angle" (1 sentence referencing ZIA/ZPA/ZDX/Zero Trust), "tags" (2-3 strings). No markdown, no backticks, just the array.`;

    function ApiKeyPrompt({ onSave }) {
      const [key, setKey] = useState('');
      return (
        <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
          <div style={{ maxWidth: 400, width: '100%' }}>
            <div style={{ fontSize: 48, textAlign: 'center', marginBottom: 16 }}>{"\u{1F6E1}\uFE0F"}</div>
            <h1 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 24, fontWeight: 700, textAlign: 'center', marginBottom: 8,
              background: 'linear-gradient(135deg, #fff 30%, #00E5FF 100%)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' }}>
              HC Cyber Intel
            </h1>
            <p style={{ textAlign: 'center', fontSize: 13, color: 'rgba(255,255,255,0.4)', marginBottom: 28 }}>
              Enter your Anthropic API key to power live intelligence scans. Your key is stored locally on this device only.
            </p>
            <input type="password" placeholder="sk-ant-..." value={key} onChange={e => setKey(e.target.value)}
              style={{ width: '100%', padding: '14px 16px', background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: 10, color: '#fff', fontSize: 14, fontFamily: "'JetBrains Mono', monospace", marginBottom: 12, outline: 'none' }} />
            <button onClick={() => { if (key.trim()) { localStorage.setItem(API_KEY_STORAGE, key.trim()); onSave(key.trim()); }}}
              style={{ width: '100%', padding: '14px', background: 'linear-gradient(135deg, rgba(0,229,255,0.15), rgba(0,230,118,0.15))', border: '1px solid rgba(0,229,255,0.25)', borderRadius: 10, color: '#00E5FF', fontSize: 15, fontWeight: 700, fontFamily: "'Space Grotesk', sans-serif", cursor: 'pointer' }}>
              Activate Intelligence Feed
            </button>
            <p style={{ textAlign: 'center', fontSize: 11, color: 'rgba(255,255,255,0.2)', marginTop: 16 }}>Get your key at console.anthropic.com</p>
          </div>
        </div>
      );
    }

    function IntelCard({ item, index, categoryColor }) {
      const [expanded, setExpanded] = useState(false);
      const severityColors = { CRITICAL: "#FF1744", HIGH: "#FF6D00", MEDIUM: "#FFAB40", LOW: "#69F0AE" };
      const sevColor = severityColors[item.severity] || "#888";
      return (
        <div onClick={() => setExpanded(!expanded)}
          style={{ background: 'rgba(10,14,23,0.85)', border: `1px solid ${expanded ? categoryColor : 'rgba(255,255,255,0.06)'}`, borderLeft: `3px solid ${sevColor}`, borderRadius: 8, padding: '14px 16px', cursor: 'pointer', transition: 'all 0.25s ease', animation: `slideUp 0.4s ease ${index * 60}ms both` }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 10 }}>
            <div style={{ flex: 1 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 6, flexWrap: 'wrap' }}>
                <span style={{ fontSize: 9, fontWeight: 800, letterSpacing: 1.5, color: sevColor, background: `${sevColor}18`, padding: '2px 7px', borderRadius: 3, fontFamily: "'JetBrains Mono', monospace" }}>{item.severity}</span>
                <span style={{ fontSize: 11, color: 'rgba(255,255,255,0.35)', fontFamily: "'JetBrains Mono', monospace" }}>{item.date}</span>
                <span style={{ fontSize: 11, color: 'rgba(255,255,255,0.25)' }}>via {item.source}</span>
              </div>
              <h3 style={{ margin: 0, fontSize: 14, fontWeight: 600, color: 'rgba(255,255,255,0.92)', fontFamily: "'Space Grotesk', sans-serif", lineHeight: 1.35 }}>{item.title}</h3>
            </div>
            <span style={{ fontSize: 11, color: 'rgba(255,255,255,0.25)', flexShrink: 0, marginTop: 2 }}>{expanded ? '\u25B2' : '\u25BC'}</span>
          </div>
          {expanded && (
            <div style={{ marginTop: 12 }}>
              <p style={{ margin: '0 0 10px', fontSize: 13, color: 'rgba(255,255,255,0.7)', lineHeight: 1.55 }}>{item.summary}</p>
              {item.url && (
                <a href={item.url} target="_blank" rel="noopener noreferrer" onClick={e => e.stopPropagation()}
                  style={{ display: 'flex', alignItems: 'center', gap: 6, background: 'rgba(255,255,255,0.03)', border: '1px solid rgba(255,255,255,0.08)', borderRadius: 6, padding: '8px 12px', marginBottom: 10, textDecoration: 'none' }}>
                  <span style={{ fontSize: 14, flexShrink: 0 }}>{"\u{1F517}"}</span>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 9, fontWeight: 700, letterSpacing: 1.5, color: 'rgba(255,255,255,0.35)', fontFamily: "'JetBrains Mono', monospace", marginBottom: 2 }}>SOURCE ARTICLE</div>
                    <div style={{ fontSize: 12, color: categoryColor, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                      {item.url.replace(/^https?:\/\/(www\.)?/, '').substring(0, 55)}{item.url.length > 65 ? '...' : ''}
                    </div>
                  </div>
                  <span style={{ fontSize: 16, color: 'rgba(255,255,255,0.3)', flexShrink: 0 }}>{"\u2192"}</span>
                </a>
              )}
              <div style={{ background: 'rgba(0,230,118,0.06)', border: '1px solid rgba(0,230,118,0.15)', borderRadius: 6, padding: '8px 12px', marginBottom: 10 }}>
                <div style={{ fontSize: 9, fontWeight: 700, letterSpacing: 1.5, color: '#00E676', marginBottom: 4, fontFamily: "'JetBrains Mono', monospace" }}>{"\u26A1"} ZSCALER ANGLE</div>
                <p style={{ margin: 0, fontSize: 12, color: 'rgba(255,255,255,0.65)', lineHeight: 1.45 }}>{item.zscaler_angle}</p>
              </div>
              <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                {(item.tags || []).map((tag, i) => (
                  <span key={i} style={{ fontSize: 10, color: categoryColor, background: `${categoryColor}15`, border: `1px solid ${categoryColor}30`, padding: '2px 8px', borderRadius: 20, fontFamily: "'JetBrains Mono', monospace" }}>{tag}</span>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [apiKey, setApiKey] = useState(localStorage.getItem(API_KEY_STORAGE) || '');
      const [results, setResults] = useState({});
      const [loading, setLoading] = useState({});
      const [errors, setErrors] = useState({});
      const [lastUpdated, setLastUpdated] = useState(null);
      const [activeFilter, setActiveFilter] = useState('all');
      const [scanning, setScanning] = useState(false);
      const [scanProgress, setScanProgress] = useState(0);
      const [showSettings, setShowSettings] = useState(false);

      if (!apiKey) return <ApiKeyPrompt onSave={setApiKey} />;

      const fetchCategory = async (category) => {
        setLoading(p => ({ ...p, [category.id]: true }));
        setErrors(p => ({ ...p, [category.id]: null }));
        try {
          const res1 = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
            body: JSON.stringify({
              model: 'claude-sonnet-4-20250514',
              max_tokens: 2048,
              system: SYS,
              tools: [{ type: 'web_search_20250305', name: 'web_search', max_uses: 2 }],
              messages: [{ role: 'user', content: `Search for: ${category.query}\nReturn ONLY a JSON array of EXACTLY 3 items. Each must have a "url" field. Start with [ end with ].` }],
            }),
          });
          if (!res1.ok) { const t = await res1.text(); throw new Error(t.substring(0, 300)); }
          const data1 = await res1.json();
          if (data1.error) throw new Error(data1.error.message);

          // Try parsing JSON from first response
          const text1 = (data1.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
          let items = tryParseJson(text1);

          // If no JSON yet, send continuation
          if (!items) {
            // Collect search URLs for reference
            const urls = [];
            for (const block of (data1.content || [])) {
              if (block.type === 'web_search_tool_result' && Array.isArray(block.content)) {
                for (const r of block.content) {
                  if (r.type === 'web_search_result' && r.url) urls.push(`${r.title}: ${r.url}`);
                }
              }
            }
            const urlHint = urls.length > 0 ? `\nSource URLs:\n${urls.slice(0, 8).join('\n')}` : '';

            const res2 = await fetch('https://api.anthropic.com/v1/messages', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
              body: JSON.stringify({
                model: 'claude-sonnet-4-20250514',
                max_tokens: 2048,
                system: SYS,
                messages: [
                  { role: 'user', content: `Search for: ${category.query}\nReturn ONLY a JSON array of EXACTLY 3 items with URLs.` },
                  { role: 'assistant', content: data1.content },
                  { role: 'user', content: `Output ONLY the JSON array of 3 items. Include "url" for each. Start with [ end with ]. No other text.${urlHint}` },
                ],
              }),
            });
            if (!res2.ok) { const t = await res2.text(); throw new Error(t.substring(0, 300)); }
            const data2 = await res2.json();
            if (data2.error) throw new Error(data2.error.message);
            const text2 = (data2.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
            items = tryParseJson(text2);
            if (!items) throw new Error('Could not parse results. Try refreshing.');
          }

          setResults(p => ({ ...p, [category.id]: items.slice(0, 3) }));
        } catch (err) {
          setErrors(p => ({ ...p, [category.id]: err.message }));
        } finally {
          setLoading(p => ({ ...p, [category.id]: false }));
        }
      };

      const tryParseJson = (text) => {
        if (!text) return null;
        let s = text.replace(/```json\s*/gi, '').replace(/```\s*/gi, '').trim();
        const a = s.indexOf('['), b = s.lastIndexOf(']');
        if (a === -1 || b === -1 || b <= a) return null;
        try {
          const arr = JSON.parse(s.substring(a, b + 1));
          return Array.isArray(arr) && arr.length > 0 ? arr : null;
        } catch { return null; }
      };

      const runFullScan = async () => {
        setScanning(true); setScanProgress(0);
        for (let i = 0; i < CATEGORIES.length; i++) {
          setScanProgress((i / CATEGORIES.length) * 100);
          await fetchCategory(CATEGORIES[i]);
          setScanProgress(((i + 1) / CATEGORIES.length) * 100);
          // Small delay between categories to avoid rate limits
          if (i < CATEGORIES.length - 1) await new Promise(r => setTimeout(r, 3000));
        }
        setLastUpdated(new Date()); setScanning(false);
      };

      const handleRefresh = (id) => { const c = CATEGORIES.find(x => x.id === id); if (c) fetchCategory(c); };
      const clearKey = () => { localStorage.removeItem(API_KEY_STORAGE); setApiKey(''); };

      const filteredCategories = activeFilter === 'all' ? CATEGORIES : CATEGORIES.filter(c => c.id === activeFilter);
      const totalItems = Object.values(results).reduce((a, b) => a + (b?.length || 0), 0);
      const criticalCount = Object.values(results).flat().filter(i => i?.severity === 'CRITICAL').length;

      return (
        <div style={{ minHeight: '100vh', background: '#060A12', color: 'white', fontFamily: "'IBM Plex Sans', sans-serif", position: 'relative' }}>
          <div style={{ position: 'fixed', inset: 0, backgroundImage: 'linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px)', backgroundSize: '40px 40px', animation: 'gridMove 8s linear infinite', pointerEvents: 'none', zIndex: 0 }} />
          <div style={{ position: 'fixed', top: -200, right: -200, width: 500, height: 500, background: 'radial-gradient(circle, rgba(0,229,255,0.06) 0%, transparent 70%)', pointerEvents: 'none', zIndex: 0 }} />

          <div style={{ position: 'relative', zIndex: 1, maxWidth: 900, margin: '0 auto', padding: '24px 20px' }}>
            {/* Header */}
            <div style={{ marginBottom: 28 }}>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <div style={{ width: 8, height: 8, borderRadius: '50%', background: scanning ? '#FFAB40' : '#00E676', boxShadow: scanning ? '0 0 12px #FFAB40' : '0 0 12px #00E676', animation: scanning ? 'pulse 0.8s ease infinite' : 'none' }} />
                  <span style={{ fontSize: 10, fontWeight: 700, letterSpacing: 3, color: 'rgba(255,255,255,0.35)', fontFamily: "'JetBrains Mono', monospace", textTransform: 'uppercase' }}>
                    {scanning ? 'Scanning Sources' : 'Intelligence Ready'}
                  </span>
                </div>
                <button onClick={() => setShowSettings(!showSettings)} style={{ background: 'none', border: 'none', color: 'rgba(255,255,255,0.3)', fontSize: 18, cursor: 'pointer', padding: 4 }}>{"\u2699\uFE0F"}</button>
              </div>
              {showSettings && (
                <div style={{ background: 'rgba(255,255,255,0.03)', border: '1px solid rgba(255,255,255,0.08)', borderRadius: 8, padding: 14, marginTop: 12, marginBottom: 12 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                    <span style={{ fontSize: 12, color: 'rgba(255,255,255,0.5)', fontFamily: "'JetBrains Mono', monospace" }}>API Key: sk-...{apiKey.slice(-6)}</span>
                    <button onClick={clearKey} style={{ background: 'rgba(255,23,68,0.1)', border: '1px solid rgba(255,23,68,0.2)', color: '#FF8A80', padding: '4px 12px', borderRadius: 5, fontSize: 11, cursor: 'pointer', fontFamily: "'JetBrains Mono', monospace" }}>Reset Key</button>
                  </div>
                </div>
              )}
              <h1 style={{ margin: '4px 0 4px', fontSize: 28, fontWeight: 700, fontFamily: "'Space Grotesk', sans-serif", letterSpacing: -1, background: 'linear-gradient(135deg, #fff 30%, #00E5FF 100%)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', lineHeight: 1.2 }}>HC Cyber Intel</h1>
              <p style={{ margin: 0, fontSize: 13, color: 'rgba(255,255,255,0.35)' }}>Healthcare Cybersecurity Intelligence {"\u00B7"} Zscaler Sales Enablement</p>
            </div>

            {/* Stats */}
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 10, marginBottom: 20 }}>
              {[
                { label: 'TOTAL INTEL', value: totalItems || '\u2014', color: '#00E5FF' },
                { label: 'CRITICAL', value: criticalCount || '\u2014', color: '#FF1744' },
                { label: 'LAST SCAN', value: lastUpdated ? lastUpdated.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'Never', color: '#FFAB40' },
              ].map((s, i) => (
                <div key={i} style={{ background: 'rgba(255,255,255,0.02)', border: '1px solid rgba(255,255,255,0.06)', borderRadius: 8, padding: '10px 14px', textAlign: 'center' }}>
                  <div style={{ fontSize: 9, fontWeight: 700, letterSpacing: 1.5, color: 'rgba(255,255,255,0.3)', fontFamily: "'JetBrains Mono', monospace", marginBottom: 4 }}>{s.label}</div>
                  <div style={{ fontSize: 20, fontWeight: 700, color: s.color, fontFamily: "'Space Grotesk', sans-serif" }}>{s.value}</div>
                </div>
              ))}
            </div>

            {/* Scan button */}
            <button onClick={runFullScan} disabled={scanning}
              style={{ width: '100%', padding: '14px 20px', position: 'relative', overflow: 'hidden', background: scanning ? 'rgba(255,171,64,0.08)' : 'linear-gradient(135deg, rgba(0,229,255,0.12), rgba(0,230,118,0.12))', border: scanning ? '1px solid rgba(255,171,64,0.2)' : '1px solid rgba(0,229,255,0.2)', borderRadius: 10, color: scanning ? '#FFAB40' : '#00E5FF', fontSize: 14, fontWeight: 700, fontFamily: "'Space Grotesk', sans-serif", cursor: scanning ? 'not-allowed' : 'pointer', marginBottom: 20 }}>
              {scanning && <div style={{ position: 'absolute', bottom: 0, left: 0, height: 2, background: 'linear-gradient(90deg, transparent, #FFAB40, transparent)', width: '50%', animation: 'scanLine 1.5s ease-in-out infinite' }} />}
              {scanning ? `\u27F3 Scanning... ${Math.round(scanProgress)}%` : '\u25B6 Run Full Intelligence Scan'}
            </button>
            {scanning && (
              <div style={{ marginBottom: 20, height: 3, background: 'rgba(255,255,255,0.05)', borderRadius: 3, overflow: 'hidden' }}>
                <div style={{ height: '100%', width: `${scanProgress}%`, background: 'linear-gradient(90deg, #00E5FF, #00E676)', borderRadius: 3, transition: 'width 0.5s ease' }} />
              </div>
            )}

            {/* Filters */}
            <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 20 }}>
              <button onClick={() => setActiveFilter('all')}
                style={{ padding: '6px 14px', borderRadius: 20, border: activeFilter === 'all' ? '1px solid rgba(255,255,255,0.3)' : '1px solid rgba(255,255,255,0.08)', background: activeFilter === 'all' ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.02)', color: activeFilter === 'all' ? 'white' : 'rgba(255,255,255,0.4)', fontSize: 12, fontWeight: 600, cursor: 'pointer', fontFamily: "'Space Grotesk', sans-serif" }}>All Feeds</button>
              {CATEGORIES.map(cat => (
                <button key={cat.id} onClick={() => setActiveFilter(cat.id)}
                  style={{ padding: '6px 14px', borderRadius: 20, border: activeFilter === cat.id ? `1px solid ${cat.color}50` : '1px solid rgba(255,255,255,0.06)', background: activeFilter === cat.id ? `${cat.color}15` : 'rgba(255,255,255,0.02)', color: activeFilter === cat.id ? cat.color : 'rgba(255,255,255,0.35)', fontSize: 12, fontWeight: 600, cursor: 'pointer', fontFamily: "'Space Grotesk', sans-serif" }}>
                  {cat.icon} {cat.label}
                </button>
              ))}
            </div>

            {/* Empty state */}
            {!lastUpdated && !scanning && (
              <div style={{ textAlign: 'center', padding: '60px 20px', color: 'rgba(255,255,255,0.2)' }}>
                <div style={{ fontSize: 48, marginBottom: 12 }}>{"\u{1F6E1}\uFE0F"}</div>
                <div style={{ fontSize: 16, fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600, marginBottom: 6 }}>Ready to Scan</div>
                <div style={{ fontSize: 13, maxWidth: 360, margin: '0 auto' }}>Hit the button above to pull the latest healthcare cybersecurity intel from across the web.</div>
              </div>
            )}

            {/* Category panels */}
            {filteredCategories.map(cat => (
              <div key={cat.id} style={{ marginBottom: 20 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                    <span style={{ fontSize: 20 }}>{cat.icon}</span>
                    <h2 style={{ margin: 0, fontSize: 16, fontWeight: 700, color: cat.color, fontFamily: "'Space Grotesk', sans-serif" }}>{cat.label}</h2>
                    {results[cat.id] && <span style={{ fontSize: 11, color: 'rgba(255,255,255,0.3)', fontFamily: "'JetBrains Mono', monospace" }}>{results[cat.id].length} items</span>}
                  </div>
                  <button onClick={() => handleRefresh(cat.id)} disabled={loading[cat.id]}
                    style={{ background: 'rgba(255,255,255,0.05)', border: '1px solid rgba(255,255,255,0.08)', color: loading[cat.id] ? 'rgba(255,255,255,0.2)' : 'rgba(255,255,255,0.5)', padding: '4px 12px', borderRadius: 5, fontSize: 11, cursor: loading[cat.id] ? 'not-allowed' : 'pointer', fontFamily: "'JetBrains Mono', monospace" }}>
                    {loading[cat.id] ? '\u27F3 Scanning...' : '\u21BB Refresh'}
                  </button>
                </div>
                {loading[cat.id] && !results[cat.id] && (
                  <div style={{ padding: 30, textAlign: 'center' }}>
                    <div className="pulse-ring" style={{ color: cat.color, fontSize: 13, fontFamily: "'JetBrains Mono', monospace" }}>Querying intelligence sources...</div>
                  </div>
                )}
                {errors[cat.id] && (
                  <div style={{ background: 'rgba(255,23,68,0.08)', border: '1px solid rgba(255,23,68,0.2)', borderRadius: 8, padding: 14, color: '#FF8A80', fontSize: 11, fontFamily: "'JetBrains Mono', monospace", wordBreak: 'break-word' }}>{"\u26A0"} {errors[cat.id]}</div>
                )}
                {results[cat.id] && (
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                    {results[cat.id].map((item, i) => <IntelCard key={i} item={item} index={i} categoryColor={cat.color} />)}
                  </div>
                )}
              </div>
            ))}

            <div style={{ marginTop: 32, paddingTop: 16, borderTop: '1px solid rgba(255,255,255,0.05)', textAlign: 'center', fontSize: 11, color: 'rgba(255,255,255,0.15)', fontFamily: "'JetBrains Mono', monospace" }}>
              HC Cyber Intel {"\u00B7"} Claude AI + Web Search {"\u00B7"} Zscaler Healthcare
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
    }
  </script>
</body>
</html>
